# The integration API (/api/v1) is called with API keys. Refuse it over plain HTTP, so nobody sets up an integration
# that sends its key unencrypted. Included in the port 80 and port 8000 servers; HTTPS (443) serves it normally.
location ^~ /api/v1 {
    default_type application/json;
    return 403 '{"success":false,"message":"The WorkSight API only works over HTTPS: https://worksight.hashnate.com/api/v1/"}';
}
