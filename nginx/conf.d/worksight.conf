# Port 80: Let's Encrypt challenge + redirect to HTTPS
server {
    listen 80;
    server_name worksight.hashnate.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: the domain over HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name worksight.hashnate.com;

    ssl_certificate     /etc/letsencrypt/live/worksight.hashnate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worksight.hashnate.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/worksight.conf;
}

# Port 8000: plain HTTP via the server IP
server {
    listen 8000 default_server;
    server_name _;

    include /etc/nginx/snippets/worksight.conf;
}
