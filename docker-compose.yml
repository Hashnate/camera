services:
  postgres:
    image: postgres:16-alpine
    container_name: worksight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worksight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: worksight
      TZ: Asia/Colombo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksight -d worksight"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: worksight_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://worksight:${POSTGRES_PASSWORD}@postgres:5432/worksight
      JWT_SECRET: ${JWT_SECRET}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_KEY: ${AI_SERVICE_KEY}
      FRONTEND_URL: https://worksight.hashnate.com
      MOBILE_ENROLL_BASE_URL: https://worksight.hashnate.com
      EZVIZ_APP_KEY: ${EZVIZ_APP_KEY:-}
      EZVIZ_APP_SECRET: ${EZVIZ_APP_SECRET:-}
      EZVIZ_ACCESS_TOKEN: ${EZVIZ_ACCESS_TOKEN:-}
      EZVIZ_API_BASE_URL: https://open.ezvizlife.com
      TZ: Asia/Colombo
    volumes:
      - uploads:/srv/uploads
      - pending_enrollments:/srv/pending_enrollments
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    container_name: worksight_ai
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:5000/api
      AI_SERVICE_KEY: ${AI_SERVICE_KEY}
      ENABLE_WORKER: "true"
      FRAME_INTERVAL_SEC: "0.25"   # analyse ~4 frames/s (YOLO on CPU)
      TZ: Asia/Colombo
    cpus: "3.0"                    # always leave 1 core free for the website
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        BACKEND_INTERNAL_URL: http://backend:5000
    container_name: worksight_frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:5000
      TZ: Asia/Colombo
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: worksight_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

volumes:
  postgres_data:
  uploads:
  pending_enrollments:
