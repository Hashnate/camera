# Builds the WorkSight manager app (mobile/) for iOS and uploads it to TestFlight.
#
# Runs when you push a tag starting with "mobile-v" (e.g. mobile-v1.0.0-1), or from the
# Actions tab with "Run workflow" (that button only shows once this file is on main).
#
# One-time Apple setup and the six repository secrets it needs: mobile/README.md,
# "Release to TestFlight".

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank = this run's number). Must be higher than the last upload of this version."
        required: false
        type: string
  push:
    tags:
      - "mobile-v*"

# Never run two uploads at once; build numbers would race.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Same Flutter the app was built and tested with locally (pubspec.lock needs >= 3.38.4).
  FLUTTER_VERSION: "3.41.6"

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Cheap Linux check that Apple accepts the API key and the app record exists, so a wrong
  # key fails in seconds instead of after a macOS build.
  apple-key:
    name: Check App Store Connect key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: pip install --quiet "pyjwt[crypto]"
      - name: Ask App Store Connect for the app
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          BUNDLE_ID="$(grep -oE 'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;' ios/Runner.xcodeproj/project.pbxproj \
            | grep -v RunnerTests | head -1 | sed -E 's/.*= ([^;]+);/\1/')"
          export BUNDLE_ID
          python3 ../.github/scripts/check_app_store_key.py

  testflight:
    name: Build and upload to TestFlight
    needs: [test, apple-key]
    # Apple only accepts builds made with Xcode 26 / the iOS 26 SDK or later.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check secrets
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        working-directory: .
        run: |
          missing=""
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
                      APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See mobile/README.md, 'Release to TestFlight'."
            exit 1
          fi

      - uses: actions/checkout@v6

      # Keep the image's default Xcode if it is a 26.x; if the default has moved to a newer major
      # (not yet tested with this Flutter), use the newest 26.x installed instead.
      # BEFORE APRIL 2027: Apple will then require the iOS 27 SDK (Xcode 27) for uploads (warning ITMS-90725
      # since Nov 2026). Move this step to Xcode 27, and FLUTTER_VERSION to a release that supports it.
      - name: Select Xcode 26
        run: |
          if ! xcodebuild -version | head -1 | grep -qE '^Xcode 26\.'; then
            version="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' \
              | sed -E 's|.*/Xcode_||; s|\.app$||' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
            if [ -z "$version" ]; then
              echo "::error::No Xcode 26 on this runner image."
              exit 1
            fi
            sudo xcode-select -s "/Applications/Xcode_$version.app/Contents/Developer"
          fi
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install certificate and provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/app.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"

          printf '%s' "$CERT_P12_BASE64" | tr -d ' \r\n' | base64 --decode > "$p12"
          printf '%s' "$PROFILE_BASE64" | tr -d ' \r\n' | base64 --decode > "$profile"

          # Temporary keychain holding only the distribution certificate + private key.
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Apple's intermediate certificate, so the identity counts as valid even if the image lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer" \
            && security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain" -t cert || true
          # A line break pasted along with the password would make it wrong.
          security import "$p12" -P "$(printf '%s' "$CERT_PASSWORD" | tr -d '\r\n')" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"

          identity_line="$(security find-identity -v -p codesigning "$keychain" | grep -E '"(Apple|iPhone|iOS) Distribution' | head -1 || true)"
          if [ -z "$identity_line" ]; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 has no valid Apple Distribution certificate with its private key."
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          identity_sha1="$(echo "$identity_line" | awk '{print $2}')"
          identity_name="$(echo "$identity_line" | sed -E 's/^[^"]*"(.*)"$/\1/')"

          # Read team, bundle ID and UUID from the profile itself, so they never drift from the secret.
          security cms -D -i "$profile" > "$profile_plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$profile_plist" 2>/dev/null; }
          profile_uuid="$(pb UUID)"
          profile_name="$(pb Name)"
          team_id="$(pb TeamIdentifier:0)"
          app_identifier="$(pb Entitlements:application-identifier)"
          bundle_id="${app_identifier#*.}"

          if pb ProvisionedDevices > /dev/null || [ "$(pb Entitlements:get-task-allow)" = "true" ]; then
            echo "::error::Profile '$profile_name' is a development/ad-hoc profile. Create an 'App Store Connect' distribution profile."
            exit 1
          fi
          if ! grep -qF "PRODUCT_BUNDLE_IDENTIFIER = $bundle_id;" ios/Runner.xcodeproj/project.pbxproj; then
            echo "::error::Profile '$profile_name' is for '$bundle_id', which is not the app's bundle ID (see ios/Runner.xcodeproj)."
            exit 1
          fi

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$profile_uuid.mobileprovision"
          done

          # Manual signing for the Runner target only (included from ios/Flutter/Release.xcconfig,
          # git-ignored). Pods targets keep their own settings.
          cat > ios/Flutter/CodeSigning.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $team_id
          CODE_SIGN_IDENTITY = $identity_name
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = $identity_name
          PROVISIONING_PROFILE_SPECIFIER = $profile_uuid
          EOF

          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$team_id</string>
            <key>signingCertificate</key><string>$identity_sha1</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$bundle_id</key><string>$profile_uuid</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$export_options"

          {
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "EXPORT_OPTIONS_PLIST=$export_options"
          } >> "$GITHUB_ENV"
          echo "Signing $bundle_id (team $team_id) with '$identity_name' and profile '$profile_name'."

      - name: Build IPA
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          build_number="${BUILD_NUMBER_INPUT:-$RUN_NUMBER}"
          if ! [[ "$build_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number must be a whole number, got '$build_number'."
            exit 1
          fi
          build_name="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          echo "BUILD_NAME=$build_name" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

          flutter build ipa --release \
            --build-number "$build_number" \
            --export-options-plist "$EXPORT_OPTIONS_PLIST"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          set -euo pipefail
          # altool looks for the key here, named AuthKey_<key id>.p8.
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_file="$key_dir/AuthKey_$API_KEY_ID.p8"
          if printf '%s' "$API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$API_KEY_P8" | tr -d '\r' > "$key_file"   # Windows line endings break it
          else
            printf '%s' "$API_KEY_P8" | tr -d ' \r\n' | base64 --decode > "$key_file"   # pasted as base64
          fi

          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          [ -n "$ipa" ] || { echo "::error::No IPA in mobile/build/ios/ipa."; exit 1; }
          # altool --upload-app is deprecated but still the simplest API-key upload; if Apple
          # removes it, switch to --upload-package or xcodebuild -exportArchive (destination=upload).
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

          {
            echo "### Uploaded WorkSight $BUILD_NAME ($BUILD_NUMBER) to TestFlight"
            echo "Apple processes the build for about 5-30 minutes before it shows under TestFlight in App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the IPA
        uses: actions/upload-artifact@v6
        with:
          name: worksight-ios-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: ignore

      - name: Remove signing files
        if: always()
        run: |
          [ -n "${SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" ios/Flutter/CodeSigning.xcconfig
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
